<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Гјан База — Предлози и Архива</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f5fa;
      --bg-accent: radial-gradient(circle at top right, rgba(99, 102, 241, 0.08), transparent 45%);
      --card: #ffffff;
      --surface: #f8fafc;
      --surface-hover: #f1f5f9;
      --text: #0f172a;
      --text-soft: #334155;
      --muted: #64748b;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-soft: #eef2ff;
      --primary-border: #c7d2fe;
      --success: #15803d;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --warn: #b45309;
      --warn-bg: #fffbeb;
      --warn-border: #fde68a;
      --info: #1d4ed8;
      --info-bg: #eff6ff;
      --info-border: #bfdbfe;
      --purple: #7e22ce;
      --purple-bg: #faf5ff;
      --purple-border: #e9d5ff;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --radius: 16px;
      --radius-sm: 10px;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #090e1a;
      --bg-accent: radial-gradient(circle at top right, rgba(99, 102, 241, 0.14), transparent 50%);
      --card: #111827;
      --surface: #182235;
      --surface-hover: #1f2c44;
      --text: #f1f5f9;
      --text-soft: #cbd5e1;
      --muted: #94a3b8;
      --border: #22304a;
      --border-strong: #334668;
      --primary: #818cf8;
      --primary-hover: #6366f1;
      --primary-soft: rgba(129, 140, 248, 0.15);
      --primary-border: rgba(129, 140, 248, 0.35);
      --success: #4ade80;
      --success-bg: rgba(34, 197, 94, 0.12);
      --success-border: rgba(34, 197, 94, 0.3);
      --warn: #fbbf24;
      --warn-bg: rgba(245, 158, 11, 0.12);
      --warn-border: rgba(245, 158, 11, 0.3);
      --info: #60a5fa;
      --info-bg: rgba(59, 130, 246, 0.14);
      --info-border: rgba(59, 130, 246, 0.32);
      --purple: #c084fc;
      --purple-bg: rgba(168, 85, 247, 0.15);
      --purple-border: rgba(168, 85, 247, 0.35);
      --danger: #f87171;
      --danger-bg: rgba(239, 68, 68, 0.13);
      --danger-border: rgba(239, 68, 68, 0.32);
      --shadow: 0 10px 34px rgba(0, 0, 0, 0.35);
      --shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      background-image: var(--bg-accent);
      color: var(--text);
      line-height: 1.55;
      padding: 18px 14px 56px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .container { max-width: 940px; margin: 0 auto; }
    .auth-wrap { max-width: 440px; margin: 48px auto 0; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px;
      box-shadow: var(--shadow);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
      flex-shrink: 0;
    }

    h1 {
      margin: 0;
      font-size: 1.28rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .version-tag {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 99px;
    }

    .user-badge { font-size: 0.84rem; color: var(--muted); margin-top: 2px; }
    .user-badge strong { color: var(--text); font-weight: 600; }

    .topbar-actions { display: flex; align-items: center; gap: 8px; }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 38px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-soft);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }
    .icon-btn:hover { background: var(--surface-hover); border-color: var(--border-strong); color: var(--text); }
    .icon-btn.danger:hover { color: var(--danger); border-color: var(--danger-border); background: var(--danger-bg); }

    /* Главни табови (4) */
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 5px;
      border-radius: 13px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 10px 10px;
      border-radius: 9px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { background: var(--card); color: var(--primary); box-shadow: var(--shadow-sm); }

    .count-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 99px;
      background: var(--primary-soft);
      color: var(--primary);
    }

    /* Банер за режим на измена */
    .edit-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px 14px;
      border-radius: 11px;
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      color: var(--warn);
      margin-bottom: 18px;
      font-size: 0.87rem;
      font-weight: 600;
    }

    .edit-banner-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .banner-btn {
      border: 1px solid currentColor;
      background: var(--card);
      color: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 8px;
      cursor: pointer;
    }
    .banner-btn:hover { filter: brightness(1.06); }
    .banner-btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* Форми */
    .form-wrap { max-width: 740px; margin: 0 auto; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .field { margin-bottom: 18px; }

    label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 0.88rem;
      margin-bottom: 6px;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--text);
    }

    .label-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .hint { font-weight: 400; font-size: 0.79rem; color: var(--muted); }

    .auto-badge {
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-soft);
      border: 1px solid var(--primary-border);
      padding: 2px 8px;
      border-radius: 99px;
      cursor: default;
    }
    .auto-badge.clickable { cursor: pointer; }
    .auto-badge.clickable:hover { filter: brightness(1.08); }

    input[type="text"],
    input[type="url"],
    input[type="password"],
    input[type="search"],
    select,
    textarea {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      transition: border-color 0.15s, box-shadow 0.15s, background-color 0.15s;
    }

    input[readonly] { opacity: 0.75; cursor: not-allowed; }

    input:focus, select:focus, textarea:focus {
      outline: none;
      background: var(--card);
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    textarea { resize: vertical; min-height: 110px; }

    .yt-preview {
      display: none;
      gap: 14px;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 18px;
      align-items: center;
    }
    .yt-preview.visible { display: flex; }

    .yt-thumb-wrap {
      position: relative;
      width: 136px;
      aspect-ratio: 16/9;
      flex-shrink: 0;
      border-radius: 8px;
      overflow: hidden;
      background: var(--border);
    }
    .yt-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .duration-overlay {
      position: absolute;
      right: 5px;
      bottom: 5px;
      background: rgba(15, 23, 42, 0.88);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
    }

    .yt-meta { min-width: 0; flex: 1; }
    .yt-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; word-break: break-word; color: var(--text); }
    .yt-orig-caption { font-size: 0.78rem; color: var(--muted); word-break: break-word; }

    .quick-extract-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
    .quick-extract-label { font-size: 0.77rem; color: var(--muted); }
    .quick-chip {
      border: 1px dashed var(--primary-border);
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 99px;
      cursor: pointer;
    }
    .quick-chip:hover { filter: brightness(1.08); }

    .ai-status {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.81rem;
      padding: 8px 12px;
      border-radius: 9px;
      margin-bottom: 8px;
      border: 1px solid transparent;
    }
    .ai-status.visible { display: flex; }
    .ai-status.loading { background: var(--primary-soft); color: var(--primary); border-color: var(--primary-border); }
    .ai-status.success { background: var(--success-bg); color: var(--success); border-color: var(--success-border); }
    .ai-status.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-border); }

    .ai-status-left { display: flex; align-items: center; gap: 8px; }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .small-action-btn {
      border: 1px solid currentColor;
      background: transparent;
      color: inherit;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .chips-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-soft);
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 99px;
      cursor: pointer;
      transition: 0.12s;
      user-select: none;
    }
    .chip:hover { border-color: var(--primary); color: var(--primary); }
    .chip.selected { background: var(--primary); border-color: var(--primary); color: #fff; }

    .selected-tags-box { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .active-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid var(--primary-border);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 99px;
    }
    .active-tag button {
      border: none;
      background: none;
      color: inherit;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
      font-size: 0.95rem;
      line-height: 1;
    }

    .alert {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.89rem;
      margin-bottom: 16px;
      border: 1px solid transparent;
    }
    .alert.visible { display: block; }
    .alert.error { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-border); }
    .alert.success { background: var(--success-bg); color: var(--success); border-color: var(--success-border); }

    .btn-primary {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff;
      font-size: 0.98rem;
      font-weight: 600;
      padding: 13px 18px;
      border-radius: 11px;
      cursor: pointer;
      transition: transform 0.1s, filter 0.15s;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
    }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
    .btn-primary:active:not(:disabled) { transform: scale(0.995); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }

    /* ================= ПРЕДЛОЗИ И АРХИВА ================= */
    .archive-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .archive-info-pill {
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--success);
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      padding: 7px 13px;
      border-radius: 10px;
    }

    .sub-tabs {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px;
      border-radius: 10px;
      gap: 4px;
    }

    .sub-tab-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 7px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .sub-tab-btn.active { background: var(--card); color: var(--primary); box-shadow: var(--shadow-sm); }

    .filters-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .search-row { margin-bottom: 10px; }

    .filters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }
    .filters-grid select { padding: 9px 11px; font-size: 0.86rem; background: var(--card); }

    .tag-filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .results-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.84rem;
      color: var(--muted);
      gap: 10px;
      flex-wrap: wrap;
    }

    .clear-filters-btn {
      border: none;
      background: none;
      color: var(--primary);
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
      padding: 2px 6px;
    }
    .clear-filters-btn:hover { text-decoration: underline; }

    .archive-list { display: flex; flex-direction: column; gap: 14px; }

    .item-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
      transition: border-color 0.15s;
    }
    .item-card:hover { border-color: var(--border-strong); }

    .video-card-layout { display: flex; gap: 16px; align-items: flex-start; }

    .card-thumb-link {
      position: relative;
      width: 200px;
      aspect-ratio: 16/9;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--border);
      display: block;
    }
    .card-thumb-link img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.2s; }
    .card-thumb-link:hover img { transform: scale(1.03); }

    .card-body { flex: 1; min-width: 0; }

    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      line-height: 1.35;
      word-break: break-word;
    }
    .card-title:hover { color: var(--primary); }

    .status-select {
      width: auto;
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      border-radius: 99px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .status-select.st-todo { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-border); }
    .status-select.st-progress { background: var(--info-bg); color: var(--info); border-color: var(--info-border); }
    .status-select.st-translated { background: var(--purple-bg); color: var(--purple); border-color: var(--purple-border); }
    .status-select.st-done { background: var(--success-bg); color: var(--success); border-color: var(--success-border); }

    .meta-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 9px; }
    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 7px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-soft);
      cursor: pointer;
    }
    .meta-pill:hover { border-color: var(--primary); color: var(--primary); }

    .card-desc { font-size: 0.88rem; color: var(--text-soft); margin: 0 0 10px; white-space: pre-line; }

    .card-note {
      font-size: 0.82rem;
      color: var(--muted);
      background: var(--card);
      border-left: 3px solid var(--primary);
      padding: 6px 10px;
      border-radius: 0 7px 7px 0;
      margin-bottom: 10px;
    }

    .card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .card-tag {
      border: 1px solid var(--primary-border);
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 0.77rem;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 99px;
      cursor: pointer;
    }
    .card-tag:hover { filter: brightness(1.08); }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-top: 9px;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .card-actions { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }

    .mini-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text-soft);
      font-size: 0.77rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 7px;
      text-decoration: none;
      cursor: pointer;
    }
    .mini-btn:hover { border-color: var(--primary); color: var(--primary); }

    .empty-state {
      text-align: center;
      padding: 42px 20px;
      color: var(--muted);
      background: var(--surface);
      border: 1px dashed var(--border-strong);
      border-radius: 14px;
      font-size: 0.92rem;
    }

    .hidden { display: none !important; }

    @media (max-width: 680px) {
      .card { padding: 18px; }
      .tabs { grid-template-columns: repeat(2, 1fr); }
      .grid-2 { grid-template-columns: 1fr; gap: 0; }
      .video-card-layout { flex-direction: column; }
      .card-thumb-link { width: 100%; }
      .yt-preview { flex-direction: column; align-items: flex-start; }
      .yt-thumb-wrap { width: 100%; }
      .tab-btn { font-size: 0.85rem; padding: 9px 6px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- ЕКРАН ЗА НАЈАВА -->
    <div id="authCard" class="auth-wrap">
      <div class="card">
        <div class="topbar" style="margin-bottom: 18px;">
          <div class="brand">
            <div class="brand-icon">✦</div>
            <div>
              <h1>Гјан База <span class="version-tag">v3.1</span></h1>
              <div class="user-badge">Предлози за превод и Архива</div>
            </div>
          </div>
          <button type="button" class="icon-btn theme-toggle-btn" title="Промени тема">🌙</button>
        </div>

        <div id="authError" class="alert error"></div>

        <form id="authForm">
          <div class="field">
            <label for="inputName">Твое име</label>
            <input type="text" id="inputName" placeholder="На пр. Ана" required />
          </div>

  <script>
    // =========================================================================
    // ВРАТИ ГО ТВОЈОТ WEB APP URL ОД GOOGLE APPS SCRIPT (завршува на /exec)
    // =========================================================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbwelW3qFkOtqY7NFFj8mgLHPk7u4jL0ttY-Dw5oc7Cdb-nbgSBDdIWGOoa3bwMwGyPb/exec';

    const STORAGE_KEY = 'archive_auth_v1';
    const THEME_KEY = 'archive_theme_v1';

    const state = {
      accessCode: '',
      userName: '',
      lists: { topics: [], speakers: [], hashtags: [] },
      archive: { videos: [], murli: [] },
      libraryView: 'proposals', // 'proposals' | 'archive'
      archiveType: 'videos',    // 'videos' | 'murli' (само во Предлози)
      activeFilterTag: '',
      videoTags: [],
      murliTags: [],
      currentVideo: null,
      showingFullTitle: false,
      lastFetchedId: null,
      userEditedDesc: false,
      userEditedSpeaker: false,
      speakerAutoFilled: false,
      userEditedTopic: false,
      topicAutoFilled: false,
      userEditedVideoTags: false,
      tagsAutoFilled: false,
      pendingAiSummary: null,
      editingVideo: null,
      editingMurli: null,
      returnAfterEdit: 'proposals'
    };

    const $ = id => document.getElementById(id);

    /* ---------- НОЌНА / СВЕТЛА ТЕМА ---------- */
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem(THEME_KEY, theme);
      document.querySelectorAll('.theme-toggle-btn').forEach(btn => {
        btn.textContent = theme === 'dark' ? '☀️' : '🌙';
        btn.title = theme === 'dark' ? 'Префрли на светла тема' : 'Префрли на ноќна тема';
      });
    }

    (function initTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === 'dark' || saved === 'light') {
        applyTheme(saved);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        applyTheme('dark');
      } else {
        applyTheme('light');
      }
    })();

    document.querySelectorAll('.theme-toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        applyTheme(current === 'dark' ? 'light' : 'dark');
      });
    });

    /* ---------- СПРЕЧИ СЛУЧАЈНО ПРАЌАЊЕ НА ФОРМА СО ENTER ---------- */
    ['videoForm', 'murliForm'].forEach(formId => {
      $(formId).addEventListener('keydown', e => {
        if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
          e.preventDefault();
        }
      });
    });

    /* ---------- API ПОВИК ---------- */
    async function apiCall(payload) {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ ...payload, accessCode: state.accessCode })
      });
      if (!response.ok) throw new Error('Мрежна грешка (' + response.status + ')');
      return await response.json();
    }

    /* ---------- НАЈАВА И ИНИЦИЈАЛИЗАЦИЈА ---------- */
    async function tryLogin(name, code, silent = false) {
      state.userName = name.trim();
      state.accessCode = code.trim();
      const btn = $('authBtn');
      if (!silent) {
        btn.disabled = true;
        btn.textContent = 'Проверка...';
        hideAlert('authError');
      }

      try {
        const res = await apiCall({ action: 'init' });
        if (!res.ok) {
          if (res.authError) localStorage.removeItem(STORAGE_KEY);
          showAlert('authError', res.error || 'Неуспешна најава.', 'error');
          return;
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ name: state.userName, code: state.accessCode }));
        state.lists = res.lists || { topics: [], speakers: [], hashtags: [] };
        state.archive = res.archive || { videos: [], murli: [] };
        $('displayUser').textContent = state.userName;
        $('authCard').classList.add('hidden');
        $('appCard').classList.remove('hidden');
        renderAllLists();
        updateArchiveCounts();
        populateArchiveFilters();
        renderArchiveList();
      } catch (err) {
        showAlert('authError', 'Не може да се поврзе со серверот. Провери дали API_URL е точен.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Влези';
      }
    }

    $('authForm').addEventListener('submit', e => {
      e.preventDefault();
      tryLogin($('inputName').value, $('inputCode').value);
    });

    $('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      state.accessCode = '';
      $('appCard').classList.add('hidden');
      $('authCard').classList.remove('hidden');
      $('inputCode').value = '';
    });

    /* ---------- ГЛАВНИ ТАБОВИ ---------- */
    function switchMainTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === tab);
      });

      const isLibrary = tab === 'proposals' || tab === 'archive';
      $('videoTab').classList.toggle('hidden', tab !== 'video');
      $('murliTab').classList.toggle('hidden', tab !== 'murli');
      $('libraryTab').classList.toggle('hidden', !isLibrary);

      if (isLibrary) {
        state.libraryView = tab;
        state.activeFilterTag = '';
        $('filterSpeaker').value = '';
        $('filterTopic').value = '';
        $('filterStatus').value = '';

        const isArchive = tab === 'archive';
        $('librarySubTabs').classList.toggle('hidden', isArchive);
        $('archiveViewBanner').classList.toggle('hidden', !isArchive);

        if (isArchive) {
          state.archiveType = 'videos';
          $('filterSpeaker').classList.remove('hidden');
          $('filterStatus').classList.add('hidden');
        } else {
          const isVideos = state.archiveType === 'videos';
          $('filterSpeaker').classList.toggle('hidden', !isVideos);
          $('filterStatus').classList.toggle('hidden', !isVideos);
        }

        populateArchiveFilters();
        renderArchiveList();
      }
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        hideAlert('globalAlert');
        switchMainTab(btn.dataset.tab);
      });
    });

    /* ---------- БЕЏОВИ ---------- */
    function setBadge(id, text, clickHandler) {
      const badge = $(id);
      badge.textContent = text;
      badge.classList.remove('hidden', 'clickable');
      badge.onclick = null;
      if (clickHandler) {
        badge.classList.add('clickable');
        badge.onclick = clickHandler;
      }
    }

    function clearBadge(id) {
      const badge = $(id);
      badge.textContent = '';
      badge.className = 'auto-badge hidden';
      badge.onclick = null;
    }

    /* ---------- ЛИСТИ И ЧИПОВИ ---------- */
    function renderAllLists() {
      $('speakersDatalist').innerHTML = state.lists.speakers.map(s => `<option value="${escapeAttr(s)}">`).join('');
      $('topicsDatalist').innerHTML = state.lists.topics.map(t => `<option value="${escapeAttr(t)}">`).join('');

      renderQuickFillChips('speakerChips', state.lists.speakers, 'ytSpeaker');
      renderQuickFillChips('videoTopicChips', state.lists.topics, 'ytTopic');
      renderQuickFillChips('murliTopicChips', state.lists.topics, 'murliTopic');

      renderHashtagPicker('video');
      renderHashtagPicker('murli');
    }

    function renderQuickFillChips(containerId, items, inputId) {
      const box = $(containerId);
      const input = $(inputId);
      box.innerHTML = '';
      items.slice(0, 12).forEach(item => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'chip' + (input.value.trim().toLowerCase() === item.toLowerCase() ? ' selected' : '');
        btn.textContent = item;
        btn.addEventListener('click', () => {
          input.value = item;
          if (inputId === 'ytSpeaker') {
            state.userEditedSpeaker = true;
            state.speakerAutoFilled = false;
            clearBadge('speakerAutoHint');
          }
          if (inputId === 'ytTopic') {
            state.userEditedTopic = true;
            state.topicAutoFilled = false;
            clearBadge('topicAutoHint');
          }
          renderQuickFillChips(containerId, items, inputId);
        });
        box.appendChild(btn);
      });
    }

    $('ytSpeaker').addEventListener('input', () => {
      state.userEditedSpeaker = true;
      state.speakerAutoFilled = false;
      clearBadge('speakerAutoHint');
      renderQuickFillChips('speakerChips', state.lists.speakers, 'ytSpeaker');
    });

    $('ytTopic').addEventListener('input', () => {
      state.userEditedTopic = true;
      state.topicAutoFilled = false;
      clearBadge('topicAutoHint');
      renderQuickFillChips('videoTopicChips', state.lists.topics, 'ytTopic');
    });

    $('murliTopic').addEventListener('input', () => {
      renderQuickFillChips('murliTopicChips', state.lists.topics, 'murliTopic');
    });

    function applySuggestedSpeaker(name, labelText) {
      $('ytSpeaker').value = name;
      state.speakerAutoFilled = true;
      setBadge('speakerAutoHint', labelText);
      renderQuickFillChips('speakerChips', state.lists.speakers, 'ytSpeaker');
    }

    function applySuggestedTopic(name, labelText) {
      $('ytTopic').value = name;
      state.topicAutoFilled = true;
      setBadge('topicAutoHint', labelText);
      renderQuickFillChips('videoTopicChips', state.lists.topics, 'ytTopic');
    }

    function renderQuickTitleTags(cleanTitle) {
      const box = $('titleQuickTags');
      const source = (cleanTitle || '').trim();
      if (!source) {
        box.innerHTML = '';
        box.classList.add('hidden');
        return;
      }

      const stop = new Set([
        'of', 'the', 'in', 'on', 'to', 'for', 'and', 'or', 'by', 'with', 'from',
        'about', 'how', 'what', 'why', 'your', 'our', 'this', 'that', 'method',
        'power', 'secret', 'way', 'ways', 'class', 'talk', 'video', 'live',
        'english', 'hindi', 'на', 'во', 'за', 'со', 'од', 'како', 'што', 'или'
      ]);

      const candidates = [];
      const addCandidate = raw => {
        const tag = normalizeTag(raw);
        if (tag && tag.length >= 4 && !candidates.some(c => c.toLowerCase() === tag.toLowerCase())) {
          candidates.push(tag);
        }
      };

      const corePhrase = source
        .replace(/^(?:method|power|art|secret|importance|way|ways|practice|role|value|meaning|science|key|keys)\s+of\s+/i, '')
        .replace(/^how\s+to\s+/i, '')
        .trim();

      if (corePhrase && corePhrase.split(/\s+/).length <= 4) {
        addCandidate(corePhrase);
      }

      corePhrase.split(/[\s,|:\-–—]+/)
        .filter(w => w.length >= 4 && !stop.has(w.toLowerCase()))
        .forEach(w => addCandidate(w));

      const top = candidates.slice(0, 5);
      if (!top.length) {
        box.innerHTML = '';
        box.classList.add('hidden');
        return;
      }

      box.innerHTML = '<span class="quick-extract-label">Брзо во хаштаг:</span>';
      top.forEach(tag => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'quick-chip';
        btn.textContent = '+ ' + tag;
        btn.addEventListener('click', () => {
          if (!state.videoTags.some(t => t.toLowerCase() === tag.toLowerCase())) {
            state.videoTags.push(tag);
            state.userEditedVideoTags = true;
            state.tagsAutoFilled = false;
            renderHashtagPicker('video');
          }
        });
        box.appendChild(btn);
      });
      box.classList.remove('hidden');
    }

    function renderHashtagPicker(mode) {
      const selectedArr = mode === 'video' ? state.videoTags : state.murliTags;
      const selectedBox = $(mode === 'video' ? 'ytSelectedTags' : 'murliSelectedTags');
      const chipsBox = $(mode === 'video' ? 'videoTagChips' : 'murliTagChips');

      selectedBox.innerHTML = '';
      selectedArr.forEach(tag => {
        const span = document.createElement('span');
        span.className = 'active-tag';
        span.innerHTML = `${escapeHtml(tag)} <button type="button" aria-label="Отстрани">&times;</button>`;
        span.querySelector('button').addEventListener('click', () => toggleTag(mode, tag));
        selectedBox.appendChild(span);
      });

      chipsBox.innerHTML = '';
      const lowerSelected = new Set(selectedArr.map(t => t.toLowerCase()));
      state.lists.hashtags.slice(0, 18).forEach(tag => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'chip' + (lowerSelected.has(tag.toLowerCase()) ? ' selected' : '');
        btn.textContent = tag;
        btn.addEventListener('click', () => toggleTag(mode, tag));
        chipsBox.appendChild(btn);
      });
    }

    function normalizeTag(raw) {
      const clean = String(raw || '')
        .trim()
        .replace(/^#+/, '')
        .replace(/[^\w\u0400-\u04FF\s-]/g, '')
        .trim();
      if (!clean) return '';
      const words = clean.split(/\s+/).filter(Boolean);
      const joined = words.length > 1
        ? words.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('')
        : words[0];
      return '#' + joined;
    }

    function toggleTag(mode, rawTag) {
      const tag = normalizeTag(rawTag);
      if (!tag) return;
      if (mode === 'video') {
        state.userEditedVideoTags = true;
        state.tagsAutoFilled = false;
        clearBadge('tagsAutoHint');
      }
      const arr = mode === 'video' ? state.videoTags : state.murliTags;
      const idx = arr.findIndex(t => t.toLowerCase() === tag.toLowerCase());
      if (idx >= 0) arr.splice(idx, 1);
      else arr.push(tag);
      renderHashtagPicker(mode);
    }

    function addTagsFromInput(mode, inputEl) {
      const parts = inputEl.value.split(',').map(s => s.trim()).filter(Boolean);
      if (parts.length && mode === 'video') {
        state.userEditedVideoTags = true;
        state.tagsAutoFilled = false;
        clearBadge('tagsAutoHint');
      }
      const arr = mode === 'video' ? state.videoTags : state.murliTags;
      parts.forEach(p => {
        const tag = normalizeTag(p);
        if (tag && !arr.some(t => t.toLowerCase() === tag.toLowerCase())) {
          arr.push(tag);
        }
      });
      inputEl.value = '';
      renderHashtagPicker(mode);
    }

    function bindTagInput(inputId, mode) {
      const el = $(inputId);
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ',') {
          e.preventDefault();
          addTagsFromInput(mode, el);
        }
      });
      el.addEventListener('blur', () => {
        if (el.value.trim()) addTagsFromInput(mode, el);
      });
    }
    bindTagInput('ytTagInput', 'video');

    /* ---------- YOUTUBE ЛИНК + AI ВО ПОЗАДИНА (НОВ ВНЕС) ---------- */
    function extractYouTubeId(url) {
      const match = String(url || '').trim().match(
        /(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/
      );
      return match ? match[1] : null;
    }

    let urlTimer = null;
    $('ytUrl').addEventListener('input', () => {

      clearTimeout(urlTimer);
      urlTimer = setTimeout(handleYouTubeInput, 450);

    $('ytUrl').addEventListener('paste', () => {
      if (state.editingVideo) return;

      urlTimer = setTimeout(handleYouTubeInput, 100);
    });

    });

    async function handleYouTubeInput() {
      const url = $('ytUrl').value.trim();
      const videoId = extractYouTubeId(url);

      if (!videoId) {
        resetVideoPreview();
        return;
      }
      if (videoId === state.lastFetchedId) return;

      state.lastFetchedId = videoId;
      state.currentVideo = null;
      state.showingFullTitle = false;
      state.userEditedDesc = false;
      state.pendingAiSummary = null;
      $('ytDesc').value = '';
      $('ytTitleInput').value = '';
      $('titleQuickTags').classList.add('hidden');
      $('titleModeBadge').classList.add('hidden');

      if (state.speakerAutoFilled) {

        state.userEditedSpeaker = false;
        clearBadge('speakerAutoHint');
        renderQuickFillChips('speakerChips', state.lists.speakers, 'ytSpeaker');
      }
      if (state.topicAutoFilled) {
        $('ytTopic').value = '';
        state.topicAutoFilled = false;
        state.userEditedTopic = false;
        clearBadge('topicAutoHint');
        renderQuickFillChips('videoTopicChips', state.lists.topics, 'ytTopic');
      }
      if (state.tagsAutoFilled) {
        state.videoTags = [];
        state.tagsAutoFilled = false;
        state.userEditedVideoTags = false;
        clearBadge('tagsAutoHint');
        renderHashtagPicker('video');
      }

      hideAlert('ytDuplicateAlert');
      hideAlert('globalAlert');
      $('saveVideoBtn').disabled = true;

      setAiStatus('loading', 'Вчитувам податоци од YouTube...', true);

      try {
        const meta = await apiCall({ action: 'fetchVideoMeta', url });
        if (state.lastFetchedId !== videoId) return;

        if (!meta.ok) {
          resetVideoPreview();
          showAlert('ytDuplicateAlert', meta.error || 'Грешка при читање на видеото.', 'error');
          return;
        }

        state.currentVideo = meta;
        $('ytThumb').src = meta.thumbnail || '';
        $('ytDurationBadge').textContent = meta.duration || '—';
        $('ytChannelText').textContent = meta.channelTitle || 'YouTube';
        $('ytFullTitleText').textContent = meta.fullTitle || meta.title;
        $('ytTitleInput').value = meta.title || '';
        $('ytPreview').classList.add('visible');

        if (meta.fullTitle && meta.fullTitle !== meta.title) {
          $('titleModeBadge').textContent = 'Користи цел наслов';
          $('titleModeBadge').classList.remove('hidden');
        }

        renderQuickTitleTags(meta.title);

        if (meta.suggestedSpeaker && !state.userEditedSpeaker && !$('ytSpeaker').value.trim()) {
          applySuggestedSpeaker(meta.suggestedSpeaker, meta.speakerSource === 'list' ? 'Од база' : 'Од наслов');
        }

        if (meta.suggestedTopic && !state.userEditedTopic && !$('ytTopic').value.trim()) {
          applySuggestedTopic(meta.suggestedTopic, meta.topicSource === 'list' ? 'Од база' : 'Од наслов');
        }

        if (meta.duplicate) {
          showAlert(
            'ytDuplicateAlert',
            `Ова видео веќе е внесено во базата (од ${meta.duplicate.addedBy || 'член'}, датум: ${meta.duplicate.date}).`,
            'error'
          );
          hideAiStatus();
          $('saveVideoBtn').disabled = true;
          return;
        }

        $('saveVideoBtn').disabled = false;
        runBackgroundSummary(meta);
      } catch (err) {
        if (state.lastFetchedId !== videoId) return;
        setAiStatus('warn', 'Грешка при поврзување со YouTube. Можеш да пробаш повторно.', false);
        $('saveVideoBtn').disabled = false;
      }
    }

    async function runBackgroundSummary(meta) {
      const targetId = meta.videoId;
      setAiStatus('loading', 'AI подготвува резиме и предлози во позадина...', true);

      try {
        const res = await apiCall({
          action: 'summarizeVideo',
          videoId: meta.videoId,
          title: meta.fullTitle || meta.title,
          rawDescription: meta.rawDescription,
          durationMinutes: meta.durationMinutes,
          detectedTopic: meta.suggestedTopic || ''
        });

        if (state.lastFetchedId !== targetId) return;

        if (!res.ok) {
          setAiStatus('warn', 'AI анализата не успеа — можеш да внесеш рачно.', false, 'Повтори', () => runBackgroundSummary(meta));
          return;
        }

        if (res.suggestedSpeaker && !state.userEditedSpeaker) {
          const currentVal = $('ytSpeaker').value.trim();
          const aiName = res.suggestedSpeaker.trim();
          const aiIsInList = state.lists.speakers.some(s => s.toLowerCase() === aiName.toLowerCase());
          const currentIsInList = state.lists.speakers.some(s => s.toLowerCase() === currentVal.toLowerCase());

          if (!currentVal || (aiIsInList && !currentIsInList)) {
            applySuggestedSpeaker(aiName, 'AI предлог');
          } else if (currentVal.toLowerCase() !== aiName.toLowerCase()) {
            setBadge('speakerAutoHint', 'AI: ' + aiName + ' (кликни)', () => {
              applySuggestedSpeaker(aiName, 'AI предлог');
            });
          }
        }

        if (res.suggestedTopic) {
          const aiTopic = res.suggestedTopic.trim();
          const currentTopic = $('ytTopic').value.trim();
          if (!state.userEditedTopic && !currentTopic) {
            applySuggestedTopic(aiTopic, 'AI предлог');
          } else if (currentTopic.toLowerCase() !== aiTopic.toLowerCase()) {
            setBadge('topicAutoHint', 'AI: ' + aiTopic + ' (кликни)', () => {
              applySuggestedTopic(aiTopic, 'AI предлог');
            });
          }
        }

        if (Array.isArray(res.suggestedHashtags) && res.suggestedHashtags.length > 0) {
          if (!state.userEditedVideoTags && state.videoTags.length === 0) {
            state.videoTags = res.suggestedHashtags.slice();
            state.tagsAutoFilled = true;
            setBadge('tagsAutoHint', 'AI предлог');
            renderHashtagPicker('video');
          } else {
            const lowerExisting = new Set(state.videoTags.map(t => t.toLowerCase()));
            const missing = res.suggestedHashtags.filter(t => !lowerExisting.has(t.toLowerCase()));
            if (missing.length > 0) {
              setBadge('tagsAutoHint', 'AI: +' + missing.join(' '), () => {
                missing.forEach(t => {
                  if (!state.videoTags.some(x => x.toLowerCase() === t.toLowerCase())) {
                    state.videoTags.push(t);
                  }
                });
                renderHashtagPicker('video');
                clearBadge('tagsAutoHint');
              });
            }
          }
        }

        const style = res.source === 'youtube_desc' ? 'warn' : 'success';
        if (state.userEditedDesc && $('ytDesc').value.trim()) {
          state.pendingAiSummary = res.summary;
          setAiStatus(style, res.statusText + ' (готово)', false, 'Вметни текст', () => {
            $('ytDesc').value = state.pendingAiSummary || '';
            setAiStatus(style, res.statusText, false);
          });
        } else {
          $('ytDesc').value = res.summary || '';
          setAiStatus(style, res.statusText, false, 'Повтори AI', () => {
            state.userEditedDesc = false;
            runBackgroundSummary(meta);
          });
        }
      } catch (err) {
        if (state.lastFetchedId !== targetId) return;
        setAiStatus('warn', 'Неуспешно AI поврзување — внеси опис рачно.', false, 'Повтори', () => runBackgroundSummary(meta));
      }
    }

    /* ================= ПРЕДЛОЗИ И АРХИВА: ФИЛТРИ И ПРИКАЗ ================= */
    function getPendingVideos() {
      return (state.archive.videos || []).filter(v => v.status !== 'Реализирано');
    }

    function getRealizedVideos() {
      return (state.archive.videos || []).filter(v => v.status === 'Реализирано');
    }

    function getCurrentLibraryItems() {
      if (state.libraryView === 'archive') return getRealizedVideos();
      return state.archiveType === 'videos' ? getPendingVideos() : (state.archive.murli || []);
    }

    function updateArchiveCounts() {
      const pendingV = getPendingVideos().length;
      const realizedV = getRealizedVideos().length;
      const murliLen = (state.archive.murli || []).length;

      $('videosCountBadge').textContent = pendingV;
      $('murliCountBadge').textContent = murliLen;
      $('proposalsTotalBadge').textContent = pendingV + murliLen;
      $('archiveTotalBadge').textContent = realizedV;
    }

    document.querySelectorAll('.sub-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.archiveType = btn.dataset.archiveType;
        state.activeFilterTag = '';
        $('filterSpeaker').value = '';
        $('filterTopic').value = '';
        $('filterStatus').value = '';
        const isVideos = state.archiveType === 'videos';
        $('filterSpeaker').classList.toggle('hidden', !isVideos);
        $('filterStatus').classList.toggle('hidden', !isVideos);
        populateArchiveFilters();
        renderArchiveList();
      });
    });

    $('refreshArchiveBtn').addEventListener('click', async () => {
      const btn = $('refreshArchiveBtn');
      btn.disabled = true;
      btn.textContent = 'Се вчитува...';
      try {
        const res = await apiCall({ action: 'getArchive' });
        if (res.ok) {
          if (res.lists) state.lists = res.lists;
          if (res.archive) state.archive = res.archive;
          renderAllLists();
          updateArchiveCounts();
          populateArchiveFilters();
          renderArchiveList();
        }
      } catch (_) {
        showAlert('globalAlert', 'Неуспешно освежување.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '↻ Освежи';
      }
    });

    ['archiveSearch', 'filterSpeaker', 'filterTopic', 'filterStatus', 'filterSort'].forEach(id => {
      $(id).addEventListener('input', renderArchiveList);
      $(id).addEventListener('change', renderArchiveList);
    });

    $('clearFiltersBtn').addEventListener('click', () => {
      $('archiveSearch').value = '';
      $('filterSpeaker').value = '';
      $('filterTopic').value = '';
      $('filterStatus').value = '';
      state.activeFilterTag = '';
      renderArchiveTagBar();
      renderArchiveList();
    });

    function populateArchiveFilters() {
      const items = getCurrentLibraryItems();
      const curSpeaker = $('filterSpeaker').value;
      const curTopic = $('filterTopic').value;

      const speakers = uniqueAlpha(items.map(i => i.speaker).filter(Boolean));
      const topics = uniqueAlpha(items.map(i => i.topic).filter(Boolean));

      $('filterSpeaker').innerHTML = '<option value="">Сите предавачи</option>' +
        speakers.map(s => `<option value="${escapeAttr(s)}">${escapeHtml(s)}</option>`).join('');
      $('filterTopic').innerHTML = '<option value="">Сите теми</option>' +
        topics.map(t => `<option value="${escapeAttr(t)}">${escapeHtml(t)}</option>`).join('');

      if (speakers.includes(curSpeaker)) $('filterSpeaker').value = curSpeaker;
      if (topics.includes(curTopic)) $('filterTopic').value = curTopic;

      renderArchiveTagBar();
    }

    function renderArchiveTagBar() {
      const items = getCurrentLibraryItems();
      const tagMap = new Map();
      items.forEach(it => {
        (it.hashtags || []).forEach(tag => {
          const key = tag.toLowerCase();
          if (!tagMap.has(key)) tagMap.set(key, { label: tag, count: 0 });
          tagMap.get(key).count++;
        });
      });

      const bar = $('archiveTagBar');
      if (tagMap.size === 0) {
        bar.innerHTML = '';
        bar.classList.add('hidden');
        return;
      }

      const sortedTags = Array.from(tagMap.values()).sort((a, b) => b.count - a.count);
      bar.innerHTML = '';
      sortedTags.forEach(obj => {
        const btn = document.createElement('button');
        btn.type = 'button';
        const isActive = state.activeFilterTag.toLowerCase() === obj.label.toLowerCase();
        btn.className = 'chip' + (isActive ? ' selected' : '');
        btn.textContent = `${obj.label} (${obj.count})`;
        btn.addEventListener('click', () => {
          state.activeFilterTag = isActive ? '' : obj.label;
          renderArchiveTagBar();
          renderArchiveList();
        });
        bar.appendChild(btn);
      });
      bar.classList.remove('hidden');
    }

    function renderArchiveList() {
      const isArchive = state.libraryView === 'archive';
      const isVideos = isArchive || state.archiveType === 'videos';
      const source = getCurrentLibraryItems();
      const query = $('archiveSearch').value.trim().toLowerCase();
      const speaker = isVideos ? $('filterSpeaker').value : '';
      const topic = $('filterTopic').value;
      const status = (!isArchive && isVideos) ? $('filterStatus').value : '';
      const sort = $('filterSort').value;
      const activeTag = state.activeFilterTag.toLowerCase();

      let filtered = source.filter(item => {
        if (speaker && (item.speaker || '') !== speaker) return false;
        if (topic && (item.topic || '') !== topic) return false;
        if (status && (item.status || '') !== status) return false;
        if (activeTag && !(item.hashtags || []).some(t => t.toLowerCase() === activeTag)) return false;
        if (query) {
          const hay = [
            item.title, item.topic, item.speaker, item.description,
            item.note, item.addedBy, (item.hashtags || []).join(' ')
          ].join(' ').toLowerCase();
          if (!hay.includes(query)) return false;
        }
        return true;
      });

      filtered = filtered.slice().sort((a, b) => {
        if (sort === 'oldest') return (a.ts || 0) - (b.ts || 0);
        if (sort === 'shortest') return (a.durationSec || 999999) - (b.durationSec || 999999);
        if (sort === 'longest') return (b.durationSec || 0) - (a.durationSec || 0);
        if (sort === 'title') return (a.title || '').localeCompare(b.title || '', 'mk');
        return (b.ts || 0) - (a.ts || 0);
      });

      const hasFilters = Boolean(query || speaker || topic || status || activeTag);
      $('clearFiltersBtn').classList.toggle('hidden', !hasFilters);
      const labelWord = isArchive ? 'реализирани видеа' : (isVideos ? 'предложени видеа' : 'мурли');
      $('resultsCountText').textContent = `Прикажани ${filtered.length} од вкупно ${source.length} ${labelWord}`;

      const listEl = $('archiveList');
      if (filtered.length === 0) {
        const emptyText = source.length === 0
          ? (isArchive
              ? 'Сè уште нема реализирани видеа. Кога видео во „Предлози“ ќе добие статус „Реализирано“, автоматски ќе се појави овде.'
              : 'Сè уште нема внесени предлози во оваа категорија.')
          : 'Нема пронајдено резултати за избраните филтри.';
        listEl.innerHTML = `<div class="empty-state">${emptyText}</div>`;
        return;
      }

      listEl.innerHTML = '';
      filtered.forEach(item => {
        listEl.appendChild(isVideos ? buildVideoCard(item) : buildMurliCard(item));
      });
    }

    function getStatusClass(st) {
      if (st === 'Реализирано') return 'st-done';
      if (st === 'Преведено') return 'st-translated';
      if (st === 'Во тек') return 'st-progress';
      return 'st-todo';
    }

    function buildVideoCard(v) {
      const safeUrl = /^https?:\/\//i.test(v.url) ? v.url : '#';
      const thumbUrl = v.videoId ? `[https://i.ytimg.com/vi/$](https://i.ytimg.com/vi/$){encodeURIComponent(v.videoId)}/mqdefault.jpg` : '';
      const card = document.createElement('article');
      card.className = 'item-card';

      card.innerHTML = `
        <div class="video-card-layout">
          <a class="card-thumb-link" href="${escapeAttr(safeUrl)}" target="_blank" rel="noopener">
            ${thumbUrl ? `<img src="${escapeAttr(thumbUrl)}" alt="" loading="lazy" />` : ''}
            ${v.duration ? `<span class="duration-overlay">${escapeHtml(v.duration)}</span>` : ''}
          </a>
          <div class="card-body">
            <div class="card-header-row">
              <a class="card-title" href="${escapeAttr(safeUrl)}" target="_blank" rel="noopener">${escapeHtml(v.title || 'Без наслов')}</a>
              <select class="status-select ${getStatusClass(v.status)}" aria-label="Статус">
                <option value="За превод" ${v.status === 'За превод' ? 'selected' : ''}>За превод</option>
                <option value="Во тек" ${v.status === 'Во тек' ? 'selected' : ''}>Во тек</option>
                <option value="Преведено" ${v.status === 'Преведено' ? 'selected' : ''}>Преведено</option>
                <option value="Реализирано" ${v.status === 'Реализирано' ? 'selected' : ''}>Реализирано ✓</option>
              </select>
            </div>
            <div class="meta-pills">
              ${v.speaker ? `<button type="button" class="meta-pill js-filter-speaker">🎙 ${escapeHtml(v.speaker)}</button>` : ''}
              ${v.topic ? `<button type="button" class="meta-pill js-filter-topic">📁 ${escapeHtml(v.topic)}</button>` : ''}
            </div>
            ${v.description ? `<p class="card-desc">${escapeHtml(v.description)}</p>` : ''}
            ${v.note ? `<div class="card-note">📝 ${escapeHtml(v.note)}</div>` : ''}
            <div class="card-tags"></div>
            <div class="card-footer">
              <span>${escapeHtml(v.date || '')}${v.addedBy ? ' · ' + escapeHtml(v.addedBy) : ''}</span>
              <div class="card-actions">
                <button type="button" class="mini-btn js-edit-video">✎ Измени</button>
                <button type="button" class="mini-btn js-copy-link">Копирај линк</button>
                <a class="mini-btn" href="${escapeAttr(safeUrl)}" target="_blank" rel="noopener">Отвори ↗</a>
              </div>
            </div>
          </div>
        </div>
      `;

      const tagsBox = card.querySelector('.card-tags');
      (v.hashtags || []).forEach(tag => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'card-tag';
        b.textContent = tag;
        b.addEventListener('click', () => {
          state.activeFilterTag = state.activeFilterTag.toLowerCase() === tag.toLowerCase() ? '' : tag;
          renderArchiveTagBar();
          renderArchiveList();
        });
        tagsBox.appendChild(b);
      });

      const spBtn = card.querySelector('.js-filter-speaker');
      if (spBtn) spBtn.addEventListener('click', () => {
        $('filterSpeaker').value = v.speaker;
        renderArchiveList();
      });

      const tpBtn = card.querySelector('.js-filter-topic');
      if (tpBtn) tpBtn.addEventListener('click', () => {
        $('filterTopic').value = v.topic;
        renderArchiveList();
      });

      card.querySelector('.js-edit-video').addEventListener('click', () => startEditVideo(v));

      const statusSel = card.querySelector('.status-select');
      statusSel.addEventListener('change', async () => {
        const newStatus = statusSel.value;
        const oldStatus = v.status;
        statusSel.className = 'status-select ' + getStatusClass(newStatus);
        statusSel.disabled = true;
        try {
          const res = await apiCall({ action: 'updateVideoStatus', videoId: v.videoId, status: newStatus });
          if (res.ok) {
            v.status = newStatus;
            updateArchiveCounts();
            if ((oldStatus !== 'Реализирано' && newStatus === 'Реализирано') ||
                (oldStatus === 'Реализирано' && newStatus !== 'Реализирано')) {
              populateArchiveFilters();
              renderArchiveList();
              showAlert(
                'globalAlert',
                newStatus === 'Реализирано'
                  ? 'Видеото е означено како реализирано и преместено во Архива.'
                  : 'Видеото е вратено во Предлози.',
                'success'
              );
            }
          } else {
            statusSel.value = oldStatus;
            statusSel.className = 'status-select ' + getStatusClass(oldStatus);
            showAlert('globalAlert', res.error || 'Грешка при промена на статус.', 'error');
          }
        } catch (_) {
          statusSel.value = oldStatus;
          statusSel.className = 'status-select ' + getStatusClass(oldStatus);
        } finally {
          statusSel.disabled = false;
        }
      });

      bindCopyButton(card.querySelector('.js-copy-link'), v.url);
      return card;
    }

    function buildMurliCard(m) {
      const safeUrl = /^https?:\/\//i.test(m.url) ? m.url : '#';
      const card = document.createElement('article');
      card.className = 'item-card';

      card.innerHTML = `
        <div class="card-header-row">
          <a class="card-title" href="${escapeAttr(safeUrl)}" target="_blank" rel="noopener">📜 ${escapeHtml(m.title || m.url)}</a>
        </div>
        <div class="meta-pills">
          ${m.topic ? `<button type="button" class="meta-pill js-filter-topic">📁 ${escapeHtml(m.topic)}</button>` : ''}
        </div>
        ${m.note ? `<div class="card-note">${escapeHtml(m.note)}</div>` : ''}
        <div class="card-tags"></div>
        <div class="card-footer">
          <span>${escapeHtml(m.date || '')}${m.addedBy ? ' · ' + escapeHtml(m.addedBy) : ''}</span>
          <div class="card-actions">
            <button type="button" class="mini-btn js-edit-murli">✎ Измени</button>
            <button type="button" class="mini-btn js-copy-link">Копирај линк</button>
            <a class="mini-btn" href="${escapeAttr(safeUrl)}" target="_blank" rel="noopener">Отвори ↗</a>
          </div>
        </div>
      `;

      const tagsBox = card.querySelector('.card-tags');
      (m.hashtags || []).forEach(tag => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'card-tag';
        b.textContent = tag;
        b.addEventListener('click', () => {
          state.activeFilterTag = state.activeFilterTag.toLowerCase() === tag.toLowerCase() ? '' : tag;
          renderArchiveTagBar();
          renderArchiveList();
        });
        tagsBox.appendChild(b);
      });

      const tpBtn = card.querySelector('.js-filter-topic');
      if (tpBtn) tpBtn.addEventListener('click', () => {
        $('filterTopic').value = m.topic;
        renderArchiveList();
      });

      card.querySelector('.js-edit-murli').addEventListener('click', () => startEditMurli(m));
      bindCopyButton(card.querySelector('.js-copy-link'), m.url);
      return card;
    }

    function bindCopyButton(btn, text) {
      btn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(text);
          const orig = btn.textContent;
          btn.textContent = '✓ Копирано';
          setTimeout(() => { btn.textContent = orig; }, 1400);
        } catch (_) {}
      });
    }

    /* ---------- ПОМОШНИ ФУНКЦИИ ---------- */
    function uniqueAlpha(arr) {
      const map = new Map();
      arr.forEach(item => {
        const key = item.toLowerCase();
        if (!map.has(key)) map.set(key, item);
      });
      return Array.from(map.values()).sort((a, b) => a.localeCompare(b, 'mk'));
    }

    function showAlert(id, msg, type) {
      const el = $(id);
      el.textContent = msg;
      el.className = 'alert visible ' + type;
    }

    function hideAlert(id) { $(id).className = 'alert'; }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function escapeAttr(str) { return escapeHtml(str); }

    (function boot() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (saved && saved.name && saved.code) {
          $('inputName').value = saved.name;
          $('inputCode').value = saved.code;
          tryLogin(saved.name, saved.code, true);
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
